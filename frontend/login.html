<!DOCTYPE html>
<html lang="en">
<!--
=============================================================
NGATURIN — login.html  (UPDATED)
=============================================================
CHANGES:
  [2] Session expired banner — if the user was auto-logged-out
      due to an expired token, a yellow banner is shown at the
      top of the card explaining why they were redirected here.

  [3] Unverified account message — if login returns 403
      (account not yet verified), the error message now also
      shows a "Resend Code" link that takes the user back to
      verify-email.html.

  [4] Forgot Password link — now actually links to
      forgot-password.html instead of href="#".

  [CLEAN] Removed the duplicate <script src="script.js"> tag.
=============================================================
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Ngaturin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('assets/Backgound Money Sign In Page.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .login-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.3);
        }
        .login-container {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: var(--spacing-3xl);
        }
        .login-card {
            background-color: var(--color-card);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 400px;
        }
        .logo-header {
            position: absolute;
            top: var(--spacing-xl);
            right: var(--spacing-xl);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: white;
            font-weight: 700;
            font-size: var(--font-size-xl);
        }
        .logo-header img { width: 48px; height: 48px; }

        /* [2] Session expired banner */
        .session-banner {
            background: #fff8e1;
            border: 1px solid #f9a825;
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: var(--font-size-sm);
            color: #e65100;
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .login-error {
            background: #fdecea;
            border: 1px solid #ef9a9a;
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: var(--font-size-sm);
            color: #c62828;
            margin-bottom: var(--spacing-md);
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="logo-header">
            <img src="assets/Logo Ngaturin.jpg" alt="Ngaturin Logo">
            <span>Ngaturin</span>
        </div>

        <div class="login-container">
            <div class="login-card fade-in">

                <!-- [2] Session-expired banner (hidden by default, shown by JS if needed) -->
                <div id="sessionBanner" class="session-banner" style="display:none;">
                    <i class="bi bi-clock-history"></i>
                    Your session expired. Please log in again.
                </div>

                <!-- Error message area -->
                <div id="loginError" class="login-error" style="display:none;"></div>

                <h2 class="mb-sm" style="color:var(--color-dark);font-size:var(--font-size-3xl);">Hallo Peps!</h2>
                <p class="mb-xl" style="color:var(--color-text-light);">
                    Good to see you again!<br>
                    Let's make your financial journey easier today.
                </p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username" class="form-label">Email</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Password" required>
                    </div>
                    <div class="form-group" style="display:flex;justify-content:space-between;align-items:center;">
                        <div class="form-checkbox">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <!-- [4] Now actually links to forgot-password.html -->
                        <a href="forgot-password.html" style="color:var(--color-text-light);font-size:var(--font-size-sm);">
                            Forgot Password?
                        </a>
                    </div>
                    <button type="submit" class="btn btn-primary w-full btn-large mt-md">Sign In</button>
                </form>

                <p class="text-center mt-lg" style="color:var(--color-text-light);font-size:var(--font-size-sm);">
                    Don't have an account?
                    <a href="register.html" style="color:var(--color-primary);font-weight:600;">Create Account</a>
                </p>
            </div>
        </div>
    </div>

    <!-- SINGLE script.js tag (was duplicated before) -->
    <script src="script.js"></script>
    <script>

    // [2] Show session-expired banner if the user was auto-logged-out
    if (sessionStorage.getItem('session_expired') === '1') {
        document.getElementById('sessionBanner').style.display = 'flex';
        sessionStorage.removeItem('session_expired');   // only show once
    }

    // ── LOGIN FORM ────────────────────────────────────────────
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email    = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorEl  = document.getElementById("loginError");
        errorEl.style.display = 'none';

        try {
            const formData = new URLSearchParams();
            formData.append("username", email);
            formData.append("password", password);

            const response = await fetch("https://ngaturin-kappa.vercel.app/api/login", {
                method:  "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body:    formData
            });

            const data = await response.json();

            if (!response.ok) {
                // [3] Special handling for unverified accounts (403 from backend)
                if (response.status === 403) {
                    errorEl.innerHTML = `
                        ${data.detail}<br>
                        <a href="verify-email.html"
                           onclick="sessionStorage.setItem('pending_verify_email','${email}')"
                           style="color:var(--color-primary);font-weight:600;">
                           Re-enter verification code →
                        </a>`;
                } else {
                    errorEl.textContent = data.detail || "Login failed";
                }
                errorEl.style.display = 'block';
                return;
            }

            localStorage.setItem("token", data.access_token);
            window.location.href = "selection.html";

        } catch (error) {
            errorEl.textContent    = "Network error. Please try again.";
            errorEl.style.display  = 'block';
        }
    });

    </script>
</body>
</html>
