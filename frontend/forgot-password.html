<!DOCTYPE html>
<html lang="en">
<!--
=============================================================
NGATURIN — forgot-password.html   [NEW FILE — [4] FORGOT PASSWORD]
=============================================================
PURPOSE:
  Gives users a way to reset their password when they forget it.
  The "Forgot Password?" link in login.html points here.

HOW IT WORKS (2 steps on one page):
  STEP 1 — Enter email:
    User types their registered email.
    We call POST /api/forgot-password { email }.
    If the email exists, a 6-digit OTP is emailed to them.
    (We always show the same message whether the email exists
     or not — this prevents attackers from guessing who is
     registered, called a "user enumeration" attack.)

  STEP 2 — Enter OTP + new password:
    User enters the OTP from their email + a new password.
    We call POST /api/reset-password { email, otp, new_password }.
    On success → redirect to login.html.

HOW TO TEST:
  1. Click "Forgot Password?" on login.html.
  2. Enter your registered email and click Send Code.
  3. Check your inbox for a 6-digit code.
  4. Enter the code + your new password + confirm password.
  5. Click Reset Password.
  6. You should be redirected to login and able to log in
     with your new password.
  7. Try using the OLD password → it should fail.
=============================================================
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Ngaturin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .forgot-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('assets/Backgound Money Sign In Page.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .forgot-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.35);
        }
        .forgot-card {
            position: relative;
            z-index: 1;
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 420px;
        }
        .step { display: none; }
        .step.active { display: block; }
        #statusMsg {
            font-size: var(--font-size-sm);
            min-height: 20px;
            margin: var(--spacing-sm) 0;
        }
        .success-msg { color: #2e7d32; }
        .error-msg   { color: #c62828; }
        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: var(--spacing-lg) 0;
        }
        .otp-inputs input {
            width: 48px; height: 56px;
            text-align: center;
            font-size: 1.5rem; font-weight: 700;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            outline: none; transition: border-color 0.2s;
        }
        .otp-inputs input:focus { border-color: var(--color-primary); }
        .otp-inputs input.filled { border-color: var(--color-primary); background: #f0faf0; }
    </style>
</head>
<body>
    <div class="forgot-page">
        <div class="forgot-card fade-in">

            <!-- STEP 1: Enter email -->
            <div class="step active" id="step1">
                <a href="login.html" style="color:var(--color-text-light);font-size:var(--font-size-sm);
                   text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-bottom:var(--spacing-lg);">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
                <div style="font-size:2.5rem;color:var(--color-primary);margin-bottom:var(--spacing-md);">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <h2 style="color:var(--color-dark);margin-bottom:var(--spacing-sm);">Forgot Password?</h2>
                <p style="color:var(--color-text-light);font-size:var(--font-size-sm);margin-bottom:var(--spacing-xl);">
                    Enter your registered email and we'll send you a reset code.
                </p>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="resetEmail" class="form-input" placeholder="example@gmail.com">
                </div>

                <div id="statusMsg"></div>

                <button id="sendBtn" class="btn btn-primary w-full btn-large mt-md" onclick="sendResetCode()">
                    Send Reset Code
                </button>
            </div>

            <!-- STEP 2: Enter OTP + new password -->
            <div class="step" id="step2">
                <div style="font-size:2.5rem;color:var(--color-primary);margin-bottom:var(--spacing-md);text-align:center;">
                    <i class="bi bi-shield-check-fill"></i>
                </div>
                <h2 style="color:var(--color-dark);margin-bottom:var(--spacing-sm);text-align:center;">Reset Password</h2>
                <p style="color:var(--color-text-light);font-size:var(--font-size-sm);text-align:center;">
                    Enter the 6-digit code sent to <strong id="sentToEmail"></strong>
                </p>

                <!-- OTP digit boxes -->
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="otp-digit" id="r0" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit" id="r1" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit" id="r2" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit" id="r3" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit" id="r4" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit" id="r5" inputmode="numeric">
                </div>

                <div class="form-group" style="margin-bottom:var(--spacing-md);">
                    <label class="form-label">New Password</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="Min. 6 characters">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" class="form-input" placeholder="Repeat password">
                </div>

                <div id="statusMsg2" style="font-size:var(--font-size-sm);min-height:20px;margin:var(--spacing-sm) 0;"></div>

                <button id="resetBtn" class="btn btn-primary w-full btn-large mt-md" onclick="submitReset()">
                    Reset Password
                </button>

                <p style="text-align:center;margin-top:var(--spacing-md);font-size:var(--font-size-sm);color:var(--color-text-light);">
                    Didn't get the code?
                    <button onclick="goBackToStep1()" style="background:none;border:none;color:var(--color-primary);
                        cursor:pointer;text-decoration:underline;font-size:inherit;">
                        Try again
                    </button>
                </p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
    const API = "https://ngaturin-kappa.vercel.app";
    let resetEmail = '';

    // ── OTP input UX (same auto-advance logic as verify-email.html) ──
    document.querySelectorAll('.otp-digit').forEach((input, i, all) => {
        input.addEventListener('input', () => {
            input.value = input.value.replace(/\D/g, '');
            if (input.value) { input.classList.add('filled'); if (i < 5) all[i+1].focus(); }
            else input.classList.remove('filled');
        });
        input.addEventListener('keydown', e => {
            if (e.key === 'Backspace' && !input.value && i > 0) {
                all[i-1].focus(); all[i-1].value = ''; all[i-1].classList.remove('filled');
            }
            if (e.key === 'Enter') submitReset();
        });
        input.addEventListener('paste', e => {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData)
                .getData('text').replace(/\D/g,'').substring(0,6);
            pasted.split('').forEach((ch, j) => {
                if (all[j]) { all[j].value = ch; all[j].classList.add('filled'); }
            });
            all[Math.min(pasted.length,5)].focus();
        });
    });

    function getOTP() {
        return Array.from(document.querySelectorAll('.otp-digit')).map(i => i.value).join('');
    }

    function setStatus(id, msg, type) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.className   = type === 'success' ? 'success-msg' : 'error-msg';
    }

    // ── STEP 1: Send reset code ────────────────────────────────
    async function sendResetCode() {
        const email = document.getElementById('resetEmail').value.trim();
        if (!email || !email.includes('@')) {
            setStatus('statusMsg', 'Please enter a valid email address.', 'error');
            return;
        }

        const btn = document.getElementById('sendBtn');
        btn.textContent = 'Sending...';
        btn.disabled    = true;

        try {
            const res = await fetch(`${API}/api/forgot-password`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email })
            });
            const data = await res.json();

            // Always show step 2 regardless (prevents user enumeration)
            resetEmail = email;
            document.getElementById('sentToEmail').textContent = email;
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');

        } catch (err) {
            setStatus('statusMsg', 'Network error. Please try again.', 'error');
            btn.textContent = 'Send Reset Code';
            btn.disabled    = false;
        }
    }

    // ── STEP 2: Submit new password ────────────────────────────
    async function submitReset() {
        const otp             = getOTP();
        const newPassword     = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmNewPassword').value;

        if (otp.length < 6) {
            setStatus('statusMsg2', 'Please enter the complete 6-digit code.', 'error');
            return;
        }
        if (newPassword.length < 6) {
            setStatus('statusMsg2', 'Password must be at least 6 characters.', 'error');
            return;
        }
        if (newPassword !== confirmPassword) {
            setStatus('statusMsg2', 'Passwords do not match.', 'error');
            return;
        }

        const btn = document.getElementById('resetBtn');
        btn.textContent = 'Resetting...';
        btn.disabled    = true;

        try {
            const res = await fetch(`${API}/api/reset-password`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email: resetEmail, otp, new_password: newPassword })
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus('statusMsg2', data.detail || 'Reset failed. Please try again.', 'error');
                btn.textContent = 'Reset Password';
                btn.disabled    = false;
                return;
            }

            setStatus('statusMsg2', 'Password reset! Redirecting to login...', 'success');
            setTimeout(() => { window.location.href = 'login.html'; }, 1800);

        } catch (err) {
            setStatus('statusMsg2', 'Network error. Please try again.', 'error');
            btn.textContent = 'Reset Password';
            btn.disabled    = false;
        }
    }

    function goBackToStep1() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
        document.getElementById('sendBtn').textContent = 'Send Reset Code';
        document.getElementById('sendBtn').disabled    = false;
        setStatus('statusMsg', '', '');
    }
    </script>
</body>
</html>
