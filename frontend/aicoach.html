<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with your AI Financial Coach">
    <title>AI Coach - Ngaturin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        .aicoach-page {
            min-height: 100vh;
            background-image: linear-gradient(135deg, #E8F4EA 0%, #F7F9F2 100%);
            padding-top: 100px;
            padding-bottom: var(--spacing-2xl);
        }

        .aicoach-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xl);
        }

        .aicoach-header img {
            max-width: 200px;
        }

        .aicoach-intro {
            max-width: 500px;
        }

        .logo-top {
            position: absolute;
            top: var(--spacing-xl);
            left: var(--spacing-xl);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--color-dark);
            font-weight: 700;
            font-size: var(--font-size-xl);
        }

        .logo-top img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div class="aicoach-page" style="position: relative; overflow-x: hidden;">
        <div class="logo-top">
            <img src="assets/Logo Ngaturin.jpg" alt="Ngaturin Logo">
            <span>Ngaturin</span>
        </div>

        <div class="back-btn" onclick="window.location.href='selection.html'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
        </div>

        <!-- Centered Header -->
        <div class="text-center fade-in"
            style="max-width: 800px; margin: 0 auto 3rem auto; padding: 0 var(--spacing-lg);">
            <h1 style="color: var(--color-dark); margin-bottom: var(--spacing-md);">
                Say Hi to Your AI Coach!
            </h1>
            <p style="font-size: var(--font-size-lg); color: var(--color-text-light);">
                Your personal finance buddy is here! Ask anything about budgeting, saving, or managing your money and
                get answers instantly.
            </p>
        </div>

        <!-- Centered Content: Chat Left, Image Right -->
        <div class="container"
            style="max-width: 1300px; margin: 0 auto; display: flex; align-items: center; justify-content: center; min-height: 70vh;">
            <div
                style="display: flex; align-items: stretch; width: 100%; height: 750px; background: transparent; border-radius: var(--radius-xl); overflow: hidden;">

                <!-- Chat (Left) -->
                <div class="slide-up" style="flex: 1.5; display: flex; height: 100%;">
                    <div class="chat-container"
                        style="width: 100%; height: 100%; margin: 0; border-radius: var(--radius-xl) 0 0 var(--radius-xl); box-shadow: var(--shadow-lg); display: flex; overflow: hidden;">

                        <!-- History Sidebar -->
                        <div class="chat-sidebar"
                            style="width: 220px; background: #f8f9fa; border-right: 1px solid var(--color-border); display: flex; flex-direction: column; padding: var(--spacing-md);">
                            <button class="btn btn-primary w-full mb-md" onclick="startNewChat()"
                                style="border-radius: var(--radius-md); font-size: var(--font-size-sm);">
                                + New Chat
                            </button>
                            <div
                                style="font-size: var(--font-size-xs); color: var(--color-text-light); font-weight: 600; margin-bottom: var(--spacing-sm); text-transform: uppercase; letter-spacing: 0.5px;">
                                Recent Chats</div>
                            <div id="chatHistoryList"
                                style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: var(--spacing-xs);">
                                <!-- History items will be added here via JS -->
                            </div>
                        </div>

                        <!-- Main Chat Area -->
                        <div class="chat-main"
                            style="flex: 1; display: flex; flex-direction: column; height: 100%; background: white;">
                            <div class="chat-messages" id="chatMessages" style="flex: 1;">
                                <div class="chat-message bot">
                                    <div class="chat-bubble bot">
                                        Hello! 👋 I'm your AI Financial Coach. How can I help you manage your money
                                        better
                                        today?
                                    </div>
                                </div>
                            </div>

                            <div class="chat-input-container">
                                <input type="text" id="chatInput" class="form-input chat-input"
                                    placeholder="Ask me anything about finance..." onkeypress="handleKeyPress(event)">
                                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Image (Right) -->
                <div class="slide-in"
                    style="flex: 1; display: flex; justify-content: flex-start; height: 100%; position: relative;">
                    <!-- Image slightly overlapping or right next to chat -->
                    <img src="assets/AI Coach (AI Coach and Chat Bot) Page .png" alt="AI Robot"
                        style="height: 100%; width: 100%; object-fit: cover; object-position: left center; border-radius: 0 var(--radius-xl) var(--radius-xl) 0;">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="aicoach.js"></script>
    <script>
        // Check if user is logged in
        if (!isLoggedIn()) {
            window.location.href = 'login.html';
        }

        // Load chat history on page load
        loadChatHistory();
    </script>
</body>

</html>
